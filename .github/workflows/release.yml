name: Release

on:
  release:
    types:
      - published

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ github.event.release.tag_name }}
    if: github.repository == 'fschrhunt/zen-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate the release tag
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          package_version="$(node --print "require('./package.json').version")"
          extension_version="$(node --print "require('./extension/manifest.json').version")"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test "$extension_version" = "$package_version"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run project checks
        run: npm run check

      - name: Build release artifacts
        run: |
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          npm run extension:pack -- artifacts
          npm sbom --omit=dev --sbom-format=spdx > "artifacts/zen-agent-${GITHUB_REF_NAME#v}.spdx.json"
          node scripts/render-homebrew-formula.mjs "artifacts/zen-agent-${GITHUB_REF_NAME#v}.tgz" > artifacts/zen-agent.rb
          (
            cd artifacts
            sha256sum zen-agent-* zen-agent.rb > SHA256SUMS
          )

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.0.0
        with:
          subject-path: artifacts/*

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
